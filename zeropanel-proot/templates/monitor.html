<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroPanel - 系统监控</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-small">
                    <svg viewBox="0 0 40 40" width="32" height="32">
                        <circle cx="20" cy="20" r="18" fill="none" stroke="#00d4ff" stroke-width="2"/>
                        <path d="M12 20 L20 12 L28 20 L20 28 Z" fill="#00d4ff"/>
                    </svg>
                </div>
                <span class="sidebar-title">ZeroPanel</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <span>仪表盘</span>
                </a>
                <a href="/websites" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                    <span>网站管理</span>
                </a>
                <a href="/databases" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <ellipse cx="12" cy="5" rx="9" ry="3"/>
                        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                    </svg>
                    <span>数据库</span>
                </a>
                <a href="/files" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>文件管理</span>
                </a>
                <a href="/monitor" class="nav-item active">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                    </svg>
                    <span>系统监控</span>
                </a>
                <a href="/php" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <polyline points="16 18 22 12 16 6"/>
                        <polyline points="8 6 2 12 8 18"/>
                    </svg>
                    <span>PHP 管理</span>
                </a>
                <a href="/cron" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span>定时任务</span>
                </a>
                <a href="/settings" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    <span>账号设置</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    <span>退出登录</span>
                </button>
            </div>
        </aside>
        
        <!-- 主内容区 -->
        <main class="main-content">
            <header class="content-header">
                <div class="header-left">
                    <button class="menu-toggle" onclick="toggleSidebar()">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                            <line x1="3" y1="12" x2="21" y2="12"/>
                            <line x1="3" y1="6" x2="21" y2="6"/>
                            <line x1="3" y1="18" x2="21" y2="18"/>
                        </svg>
                    </button>
                    <h1 class="page-title">系统监控</h1>
                </div>
                <div class="header-right">
                    <span class="update-info" id="update-info">实时更新</span>
                </div>
            </header>
            
            <div class="content-body">
                <!-- 实时图表 -->
                <section class="charts-section">
                    <div class="chart-grid">
                        <div class="chart-card">
                            <div class="chart-header">
                                <svg viewBox="0 0 24 24" width="20" height="20" stroke="#00d4ff" stroke-width="2" fill="none">
                                    <rect x="4" y="4" width="16" height="16" rx="2" ry="2"/>
                                    <rect x="9" y="9" width="6" height="6"/>
                                </svg>
                                <span>CPU 使用率</span>
                            </div>
                            <div class="chart-container">
                                <canvas id="cpu-chart"></canvas>
                            </div>
                            <div class="chart-value" id="cpu-current">0%</div>
                        </div>
                        <div class="chart-card">
                            <div class="chart-header">
                                <svg viewBox="0 0 24 24" width="20" height="20" stroke="#00d4ff" stroke-width="2" fill="none">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                    <polyline points="22,6 12,13 2,6"/>
                                </svg>
                                <span>内存使用率</span>
                            </div>
                            <div class="chart-container">
                                <canvas id="memory-chart"></canvas>
                            </div>
                            <div class="chart-value" id="memory-current">0%</div>
                        </div>
                    </div>
                </section>
                
                <!-- 网络流量 -->
                <section class="network-section">
                    <h2 class="section-title">网络流量</h2>
                    <div class="network-grid">
                        <div class="network-card">
                            <div class="network-icon in">
                                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                                    <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
                                    <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
                                </svg>
                            </div>
                            <div class="network-info">
                                <div class="network-label">接收</div>
                                <div class="network-value" id="network-in">0 KB</div>
                            </div>
                        </div>
                        <div class="network-card">
                            <div class="network-icon out">
                                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                                    <polyline points="22 12 16 12 14 9 10 9 8 12 2 12"/>
                                    <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
                                </svg>
                            </div>
                            <div class="network-info">
                                <div class="network-label">发送</div>
                                <div class="network-value" id="network-out">0 KB</div>
                            </div>
                        </div>
                    </div>
                </section>
                
                <!-- 系统负载 -->
                <section class="load-section">
                    <h2 class="section-title">系统负载</h2>
                    <div class="load-bars">
                        <div class="load-bar-item">
                            <div class="load-label">1分钟</div>
                            <div class="load-bar">
                                <div class="load-fill" id="load-1" style="width: 0%"></div>
                            </div>
                            <div class="load-value" id="load-1-value">0</div>
                        </div>
                        <div class="load-bar-item">
                            <div class="load-label">5分钟</div>
                            <div class="load-bar">
                                <div class="load-fill" id="load-5" style="width: 0%"></div>
                            </div>
                            <div class="load-value" id="load-5-value">0</div>
                        </div>
                        <div class="load-bar-item">
                            <div class="load-label">15分钟</div>
                            <div class="load-bar">
                                <div class="load-fill" id="load-15" style="width: 0%"></div>
                            </div>
                            <div class="load-value" id="load-15-value">0</div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
    
    <div id="toast-container"></div>
    
    <script src="/static/js/app.js"></script>
    <script src="/static/js/monitor.js"></script>
</body>
</html>
