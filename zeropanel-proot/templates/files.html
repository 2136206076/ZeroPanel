<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroPanel - 文件管理</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-small">
                    <svg viewBox="0 0 40 40" width="32" height="32">
                        <circle cx="20" cy="20" r="18" fill="none" stroke="#00d4ff" stroke-width="2"/>
                        <path d="M12 20 L20 12 L28 20 L20 28 Z" fill="#00d4ff"/>
                    </svg>
                </div>
                <span class="sidebar-title">ZeroPanel</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <span>仪表盘</span>
                </a>
                <a href="/websites" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                    <span>网站管理</span>
                </a>
                <a href="/databases" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <ellipse cx="12" cy="5" rx="9" ry="3"/>
                        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                    </svg>
                    <span>数据库</span>
                </a>
                <a href="/files" class="nav-item active">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>文件管理</span>
                </a>
                <a href="/monitor" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                    </svg>
                    <span>系统监控</span>
                </a>
                <a href="/php" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <polyline points="16 18 22 12 16 6"/>
                        <polyline points="8 6 2 12 8 18"/>
                    </svg>
                    <span>PHP 管理</span>
                </a>
                <a href="/cron" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span>定时任务</span>
                </a>
                <a href="/settings" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    <span>账号设置</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    <span>退出登录</span>
                </button>
            </div>
        </aside>
        
        <!-- 主内容区 -->
        <main class="main-content">
            <header class="content-header">
                <div class="header-left">
                    <button class="menu-toggle" onclick="toggleSidebar()">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                            <line x1="3" y1="12" x2="21" y2="12"/>
                            <line x1="3" y1="6" x2="21" y2="6"/>
                            <line x1="3" y1="18" x2="21" y2="18"/>
                        </svg>
                    </button>
                    <h1 class="page-title">文件管理</h1>
                </div>
                <div class="header-right">
                    <button class="btn btn-secondary" id="extract-btn" onclick="extractSelected()" disabled>
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        解压
                    </button>
                    <button class="btn btn-secondary" id="compress-btn" onclick="showCompressModal()" disabled>
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
                            <path d="M4 8h16M4 16h16"/>
                            <path d="M8 4v16M16 4v16"/>
                        </svg>
                        压缩
                    </button>
                    <button class="btn btn-secondary" onclick="showMkdirModal()">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            <line x1="12" y1="11" x2="12" y2="17"/>
                            <line x1="9" y1="14" x2="15" y2="14"/>
                        </svg>
                        新建目录
                    </button>
                    <button class="btn btn-primary" onclick="triggerUpload()">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        上传文件
                    </button>
                    <input type="file" id="file-input" style="display: none" onchange="uploadFile(this)">
                </div>
            </header>
            
            <div class="content-body">
                <!-- 面包屑导航 -->
                <div class="breadcrumb" id="breadcrumb">
                    <a href="#" onclick="navigateTo('/')">/</a>
                </div>
                
                <!-- 文件列表 -->
                <section class="file-section">
                    <div class="file-list" id="file-list">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" width="48" height="48" stroke="#4a4a6a" stroke-width="2" fill="none">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            </svg>
                            <p>目录为空</p>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
    
    <!-- 新建目录弹窗 -->
    <div class="modal" id="mkdir-modal">
        <div class="modal-overlay" onclick="hideMkdirModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>新建目录</h2>
                <button class="modal-close" onclick="hideMkdirModal()">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <form id="mkdir-form" class="modal-form">
                <div class="form-group">
                    <label>目录名</label>
                    <input type="text" id="dir-name" name="name" placeholder="输入目录名" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="hideMkdirModal()">取消</button>
                    <button type="submit" class="btn btn-primary">创建</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- 重命名弹窗 -->
    <div class="modal" id="rename-modal">
        <div class="modal-overlay" onclick="hideRenameModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>重命名</h2>
                <button class="modal-close" onclick="hideRenameModal()">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <form id="rename-form" class="modal-form">
                <div class="form-group">
                    <label>新名称</label>
                    <input type="text" id="new-name" name="new_name" placeholder="输入新名称" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="hideRenameModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- 文件编辑弹窗 -->
    <div class="modal" id="edit-modal">
        <div class="modal-overlay" onclick="hideEditModal()"></div>
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2 id="edit-file-name">编辑文件</h2>
                <button class="modal-close" onclick="hideEditModal()">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <textarea id="file-content" class="code-editor" spellcheck="false"></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="hideEditModal()">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveFile()">保存</button>
            </div>
        </div>
    </div>
    
    <!-- 压缩弹窗 -->
    <div class="modal" id="compress-modal">
        <div class="modal-overlay" onclick="hideCompressModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>压缩文件</h2>
                <button class="modal-close" onclick="hideCompressModal()">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>压缩包名称</label>
                    <input type="text" id="compress-name" placeholder="例如: backup">
                    <small class="form-hint">不需要包含扩展名</small>
                </div>
                <div class="form-group">
                    <label>格式</label>
                    <select id="compress-format">
                        <option value="zip">zip</option>
                        <option value="tar.gz">tar.gz</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="hideCompressModal()">取消</button>
                <button type="button" class="btn btn-primary" onclick="compressFiles()">压缩</button>
            </div>
        </div>
    </div>
    
    <div id="toast-container"></div>
    
    <script src="/static/js/app.js"></script>
    <script src="/static/js/files.js"></script>
</body>
</html>
