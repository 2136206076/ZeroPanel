<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroPanel - 仪表盘</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-small">
                    <svg viewBox="0 0 40 40" width="32" height="32">
                        <circle cx="20" cy="20" r="18" fill="none" stroke="#00d4ff" stroke-width="2"/>
                        <path d="M12 20 L20 12 L28 20 L20 28 Z" fill="#00d4ff"/>
                    </svg>
                </div>
                <span class="sidebar-title">ZeroPanel</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-item active">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <span>仪表盘</span>
                </a>
                <a href="/websites" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                    <span>网站管理</span>
                </a>
                <a href="/databases" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <ellipse cx="12" cy="5" rx="9" ry="3"/>
                        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                    </svg>
                    <span>数据库</span>
                </a>
                <a href="/files" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>文件管理</span>
                </a>
                <a href="/monitor" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                    </svg>
                    <span>系统监控</span>
                </a>
                <a href="/settings" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    <span>账号设置</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    <span>退出登录</span>
                </button>
            </div>
        </aside>
        
        <!-- 主内容区 -->
        <main class="main-content">
            <header class="content-header">
                <div class="header-left">
                    <button class="menu-toggle" onclick="toggleSidebar()">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                            <line x1="3" y1="12" x2="21" y2="12"/>
                            <line x1="3" y1="6" x2="21" y2="6"/>
                            <line x1="3" y1="18" x2="21" y2="18"/>
                        </svg>
                    </button>
                    <h1 class="page-title">仪表盘</h1>
                </div>
                <div class="header-right">
                    <span class="user-info" id="username-display">admin</span>
                </div>
            </header>
            
            <div class="content-body">
                <!-- 系统信息 -->
                <section class="system-info-section">
                    <div class="info-card">
                        <div class="info-icon">
                            <svg viewBox="0 0 24 24" width="24" height="24" stroke="#00d4ff" stroke-width="2" fill="none">
                                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                                <line x1="8" y1="21" x2="16" y2="21"/>
                                <line x1="12" y1="17" x2="12" y2="21"/>
                            </svg>
                        </div>
                        <div class="info-content">
                            <div class="info-label">主机名</div>
                            <div class="info-value" id="hostname">-</div>
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="info-icon">
                            <svg viewBox="0 0 24 24" width="24" height="24" stroke="#00d4ff" stroke-width="2" fill="none">
                                <circle cx="12" cy="12" r="10"/>
                                <polyline points="12 6 12 12 16 14"/>
                            </svg>
                        </div>
                        <div class="info-content">
                            <div class="info-label">运行时间</div>
                            <div class="info-value" id="uptime">-</div>
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="info-icon">
                            <svg viewBox="0 0 24 24" width="24" height="24" stroke="#00d4ff" stroke-width="2" fill="none">
                                <path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H6a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/>
                            </svg>
                        </div>
                        <div class="info-content">
                            <div class="info-label">系统</div>
                            <div class="info-value" id="os">-</div>
                        </div>
                    </div>
                </section>
                
                <!-- 服务状态 -->
                <section class="services-section">
                    <h2 class="section-title">服务状态</h2>
                    <div class="services-grid">
                        <div class="service-card">
                            <div class="service-name">Nginx</div>
                            <div class="service-status" id="nginx-status">
                                <span class="status-dot"></span>
                                <span class="status-text">检测中...</span>
                            </div>
                        </div>
                        <div class="service-card">
                            <div class="service-name">MariaDB</div>
                            <div class="service-status" id="mysql-status">
                                <span class="status-dot"></span>
                                <span class="status-text">检测中...</span>
                            </div>
                        </div>
                        <div class="service-card">
                            <div class="service-name">PHP-FPM</div>
                            <div class="service-status" id="php-status">
                                <span class="status-dot"></span>
                                <span class="status-text">检测中...</span>
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="startServices()">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                        启动所有服务
                    </button>
                </section>
                
                <!-- 资源监控 -->
                <section class="stats-section">
                    <h2 class="section-title">资源使用</h2>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-header">
                                <svg viewBox="0 0 24 24" width="20" height="20" stroke="#00d4ff" stroke-width="2" fill="none">
                                    <rect x="4" y="4" width="16" height="16" rx="2" ry="2"/>
                                    <rect x="9" y="9" width="6" height="6"/>
                                </svg>
                                <span>CPU</span>
                            </div>
                            <div class="stat-circle" data-value="0" id="cpu-circle">
                                <svg viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="45" fill="none" stroke="#2a2a4a" stroke-width="8"/>
                                    <circle cx="50" cy="50" r="45" fill="none" stroke="#00d4ff" stroke-width="8" stroke-dasharray="0 283" stroke-linecap="round" transform="rotate(-90 50 50)"/>
                                </svg>
                                <div class="stat-value">0%</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-header">
                                <svg viewBox="0 0 24 24" width="20" height="20" stroke="#00d4ff" stroke-width="2" fill="none">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                    <polyline points="22,6 12,13 2,6"/>
                                </svg>
                                <span>内存</span>
                            </div>
                            <div class="stat-circle" data-value="0" id="memory-circle">
                                <svg viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="45" fill="none" stroke="#2a2a4a" stroke-width="8"/>
                                    <circle cx="50" cy="50" r="45" fill="none" stroke="#00d4ff" stroke-width="8" stroke-dasharray="0 283" stroke-linecap="round" transform="rotate(-90 50 50)"/>
                                </svg>
                                <div class="stat-value">0%</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-header">
                                <svg viewBox="0 0 24 24" width="20" height="20" stroke="#00d4ff" stroke-width="2" fill="none">
                                    <ellipse cx="12" cy="5" rx="9" ry="3"/>
                                    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                                </svg>
                                <span>磁盘</span>
                            </div>
                            <div class="stat-circle" data-value="0" id="disk-circle">
                                <svg viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="45" fill="none" stroke="#2a2a4a" stroke-width="8"/>
                                    <circle cx="50" cy="50" r="45" fill="none" stroke="#00d4ff" stroke-width="8" stroke-dasharray="0 283" stroke-linecap="round" transform="rotate(-90 50 50)"/>
                                </svg>
                                <div class="stat-value">0%</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-header">
                                <svg viewBox="0 0 24 24" width="20" height="20" stroke="#00d4ff" stroke-width="2" fill="none">
                                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                                </svg>
                                <span>负载</span>
                            </div>
                            <div class="stat-value-large" id="load-value">-</div>
                        </div>
                    </div>
                </section>
                
                <!-- 快捷入口 -->
                <section class="quick-links-section">
                    <h2 class="section-title">快捷入口</h2>
                    <div class="quick-links-grid">
                        <a href="/websites" class="quick-link-card">
                            <svg viewBox="0 0 24 24" width="32" height="32" stroke="#00d4ff" stroke-width="2" fill="none">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="2" y1="12" x2="22" y2="12"/>
                                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                            </svg>
                            <span>网站管理</span>
                        </a>
                        <a href="/databases" class="quick-link-card">
                            <svg viewBox="0 0 24 24" width="32" height="32" stroke="#00d4ff" stroke-width="2" fill="none">
                                <ellipse cx="12" cy="5" rx="9" ry="3"/>
                                <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                            </svg>
                            <span>数据库管理</span>
                        </a>
                        <a href="/files" class="quick-link-card">
                            <svg viewBox="0 0 24 24" width="32" height="32" stroke="#00d4ff" stroke-width="2" fill="none">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            </svg>
                            <span>文件管理</span>
                        </a>
                        <a href="/monitor" class="quick-link-card">
                            <svg viewBox="0 0 24 24" width="32" height="32" stroke="#00d4ff" stroke-width="2" fill="none">
                                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                            </svg>
                            <span>系统监控</span>
                        </a>
                    </div>
                </section>
            </div>
        </main>
    </div>
    
    <div id="toast-container"></div>
    
    <script src="/static/js/app.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
